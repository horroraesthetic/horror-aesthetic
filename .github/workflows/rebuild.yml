name: rebuild-indexes
# When a review or article is added or edited, regenerate the archive, search index, daily list and review feed automatically.
on:
  push:
    branches: [main]
    paths:
      - 'reviews/**'
      - 'articles/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-indexes
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild generated files
        run: |
          python3 scripts/build-archive.py
          python3 scripts/build-search-index.py
          python3 scripts/build-daily.py
          node scripts/build-catalogue.mjs
          python3 scripts/build-collections.py
          python3 scripts/build-films.py
          sudo apt-get install -y -q fonts-liberation fonts-dejavu-core >/dev/null
          pip install -q pillow
          python3 scripts/build-og.py
          python3 scripts/build-feed.py
      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Auto-rebuild indexes [skip ci]"
            git push
          else
            echo "Nothing to rebuild"
          fi
