plugins {
    id 'com.android.application'
}

def vcode = (project.findProperty('vc') ?: '1').toString().toInteger()

android {
    namespace 'io.github.horroraesthetic'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'io.github.horroraesthetic'
        minSdk 24
        targetSdk 34
        versionCode vcode
        versionName "1.0.${vcode}"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias System.getenv('KS_ALIAS')
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

android.sourceSets.main.assets.srcDir '../../app/night-data'

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
