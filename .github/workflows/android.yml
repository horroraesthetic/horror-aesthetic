name: build-android-apk
# Builds the Horror Aesthetic Android app (a full-screen wrapper around the /app/ page) and publishes it as a GitHub release asset.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/night-data/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/night-data/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled on the runner)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" | tail -3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the stable signing key from the private cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ks
          key: android-keystore-v1
      - name: Signing key (repository secret if set, else the private cached key, else a new one that gets cached)
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          D="$RUNNER_TEMP/ks"; mkdir -p "$D"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ] && [ -n "$KS_ALIAS_SECRET" ]; then
            echo "$KS_B64" | base64 -d > "$D/release.jks"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KS_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "Using the secret signing key"
          elif [ -f "$D/release.jks" ] && [ -f "$D/pass" ]; then
            echo "KS_PASS=$(cat "$D/pass")" >> "$GITHUB_ENV"
            echo "KS_ALIAS=ha" >> "$GITHUB_ENV"
            echo "Using the cached signing key"
          else
            P=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
            keytool -genkeypair -keystore "$D/release.jks" -storepass "$P" -keypass "$P" -alias ha -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Horror Aesthetic"
            echo "$P" > "$D/pass"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
            echo "KS_ALIAS=ha" >> "$GITHUB_ENV"
            echo "Created a new signing key (cached for next builds)"
          fi
          echo "KS_FILE=$D/release.jks" >> "$GITHUB_ENV"
      - name: Compile Android for review
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        working-directory: android
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/new-apk-signature"
          if gh release view app-latest >/dev/null 2>&1; then
            gh release download app-latest --pattern horror-aesthetic.apk --dir "$RUNNER_TEMP/previous"
            "$signer" verify --print-certs "$RUNNER_TEMP/previous/horror-aesthetic.apk" > "$RUNNER_TEMP/old-apk-signature"
            old="$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/old-apk-signature")"
            new="$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/new-apk-signature")"
            test "$old" = "$new"
          fi
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk horror-aesthetic.apk
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest horror-aesthetic.apk --title "Horror Aesthetic for Android" --notes "Install: download the APK, open it, allow installation from this source when asked. Build ${{ github.run_number }}."
