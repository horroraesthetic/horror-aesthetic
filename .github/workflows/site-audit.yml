name: site-audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check enhancements JavaScript syntax
        run: node --check enhancements.js
      - name: Check review index JavaScript syntax
        run: node --check reviews-index.js
      - name: Check review tools JavaScript syntax
        run: node --check review-tools.js
      - name: Check service worker JavaScript syntax
        run: node --check sw.js
      - name: Check audit script syntax
        run: node --check scripts/site-audit.mjs
      - name: Validate sitemap, accessibility and HTML basics
        run: node scripts/site-audit.mjs
