name: build-android-apk
# Builds the Horror Aesthetic Android app (a full-screen wrapper around the /app/ page) and publishes it as a GitHub release asset.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key (stable if the secret exists, otherwise a one-off key)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ] && [ -n "$KS_ALIAS_SECRET" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KS_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "Using the stable signing key"
          else
            P=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$P" -keypass "$P" -alias ha -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Horror Aesthetic"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
            echo "KS_ALIAS=ha" >> "$GITHUB_ENV"
            echo "Using a one-off signing key (updates need the old app uninstalled first)"
          fi
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk horror-aesthetic.apk
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest horror-aesthetic.apk --title "Horror Aesthetic for Android" --notes "Install: download the APK, open it, allow installation from this source when asked. Build ${{ github.run_number }}."
