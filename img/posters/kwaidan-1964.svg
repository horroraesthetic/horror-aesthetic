<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
<title id="title">Kwaidan — 1964 | HORROR AESTHETIC</title><desc id="desc">Original gothic Japanese ghost-story poster: a spectral woman above a moonlit lake, a distant house and a lone boatman.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#08070a"/><stop offset=".48" stop-color="#171015"/><stop offset="1" stop-color="#050609"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#f0dfc9"/><stop offset=".72" stop-color="#c5b4a5"/><stop offset="1" stop-color="#75666a"/></radialGradient>
 <linearGradient id="ghost" x2=".9" y2="1"><stop stop-color="#d9c9c1" stop-opacity=".82"/><stop offset=".5" stop-color="#82767b" stop-opacity=".48"/><stop offset="1" stop-color="#171219" stop-opacity="0"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#b8a4a0" stop-opacity=".45"/><stop offset="1" stop-color="#111018" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values=" .7 0 0 0 .1  0 .6 0 0 .08  0 0 .6 0 .08  0 0 0 .17 0"/></filter>
</defs>
