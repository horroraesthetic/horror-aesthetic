name: site-audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shared JavaScript syntax
        run: |-
          node --check enhancements.js
          node --check reviews-index.js
          node --check review-tools.js
          node --check sw.js
          node --check scripts/site-audit.mjs
      - name: Validate sitemap, accessibility and HTML basics
        run: node scripts/site-audit.mjs
