plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.horroraesthetic'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.horroraesthetic'
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty('vc') ?: '1').toInteger()
        versionName '1.0.' + (project.findProperty('vc') ?: '1')
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias System.getenv('KS_ALIAS')
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
