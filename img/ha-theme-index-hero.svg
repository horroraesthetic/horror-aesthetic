 <path d="M85 520 140 130l55 390-34-90 39 90H75l40-95Z"/>
 <path d="M220 520 265 205l54 315-32-76 45 76H205l40-80Z"/>
 <path d="M1310 520 1360 105l58 415-37-100 48 100h-145l48-105Z"/>
 <path d="M1430 520 1465 250l35 270Z"/>
