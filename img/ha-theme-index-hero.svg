<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="img" aria-labelledby="t d">
<title id="t">The haunted index</title><desc id="d">A crimson moon above a deserted Japanese shrine, black cedar silhouettes and drifting fog, framed like damaged archival film.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#160c13"/><stop offset=".55" stop-color="#09080d"/><stop offset="1" stop-color="#030407"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#f3a4a0"/><stop offset=".65" stop-color="#b83a46"/><stop offset="1" stop-color="#6e1727"/></radialGradient>
 <linearGradient id="fog" x2="0" y2="1"><stop stop-color="#c7a7a4" stop-opacity="0"/><stop offset=".5" stop-color="#c7a7a4" stop-opacity=".19"/><stop offset="1" stop-color="#c7a7a4" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse"><circle cx="8" cy="18" r="1" fill="#fff" opacity=".16"/><circle cx="66" cy="77" r="1" fill="#fff" opacity=".12"/><circle cx="104" cy="30" r=".8" fill="#fff" opacity=".14"/><path d="M20 0v120M91 0v120" stroke="#fff" stroke-opacity=".025"/></pattern>
</defs>
<rect width="1500" height="620" fill="url(#bg)"/>
<circle cx="1080" cy="215" r="170" fill="#9b1e31" opacity=".2" filter="url(#blur)"/>
<circle cx="1080" cy="215" r="133" fill="url(#moon)"/>
<path d="M960 155q45-34 83-4t90-4q-45 35-84 21t-89 23M1000 254q50-23 100 2t90-4" fill="none" stroke="#48111e" stroke-width="12" opacity=".38"/>
<path d="M0 430 160 330l90 48 126-142 118 175 124-84 102 97 126-145 90 119 105-86 112 106 115-83 132 107v178H0Z" fill="#100b13"/>
<path d="M0 478q180-70 360 0t360 0 360 0 420 0v142H0Z" fill="#07070b"/>
